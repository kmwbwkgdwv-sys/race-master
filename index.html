<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>race-master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: always landscape (rotated if the device is upright). Home = logo + tab rail on the left, live 3D machine in the middle, one working panel on the right. Race HUD sits in the corners. */
  --ink:#090b11;
  --paper:#f6f2e8;
  --hot:#ff4a26;      /* start-light red: the one accent */
  --volt:#ffd60a;     /* timing yellow: numbers and selection */
  --dim:rgba(246,242,232,.64);
  --line:rgba(246,242,232,.18);
  --glass:rgba(9,11,17,.66);
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;touch-action:none}
#stage.rot{transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:none}
button:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
[hidden]{display:none!important}

/* ---------- home ---------- */
#home{position:absolute;inset:0;display:grid;grid-template-columns:minmax(150px,24%) minmax(0,1fr) minmax(280px,46%);
  background:linear-gradient(90deg,rgba(9,11,17,.82) 0%,rgba(9,11,17,.2) 26%,rgba(9,11,17,0) 46%,rgba(9,11,17,.74) 60%,rgba(9,11,17,.93) 100%)}
.rail{display:flex;flex-direction:column;gap:10px;padding:16px 0 16px 18px;min-height:0}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.4vw,50px);line-height:.86;letter-spacing:-.02em;transform:skewX(-9deg);transform-origin:left bottom}
.logo span{display:block;color:var(--hot)}
.logo i{display:block;font-style:normal;font-family:var(--body);font-weight:900;font-size:10px;letter-spacing:.34em;color:var(--dim);margin-top:8px}
.tabs{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tab{text-align:left;padding:8px 12px;font-weight:900;font-size:14px;border-left:4px solid transparent;color:var(--dim);border-radius:0 4px 4px 0}
.tab[aria-selected="true"]{color:var(--paper);border-left-color:var(--hot);background:linear-gradient(90deg,rgba(255,74,38,.28),transparent)}
.mid{position:relative;min-width:0}
.plate{position:absolute;left:4px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.who{font-size:12px;color:var(--dim);line-height:1.5;text-shadow:0 1px 0 #000}
.who b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(18px,3.4vw,28px);color:var(--paper)}
#go{font-family:var(--display);font-size:clamp(18px,3.2vw,24px);padding:12px 34px 12px 26px;background:var(--hot);color:#fff;border-radius:4px;
  transform:skewX(-9deg);box-shadow:5px 5px 0 var(--ink),5px 5px 0 2px var(--volt)}
#go:active{transform:skewX(-9deg) translate(3px,3px);box-shadow:2px 2px 0 var(--ink),2px 2px 0 2px var(--volt)}
.panel{display:flex;flex-direction:column;gap:10px;padding:14px 16px 14px 8px;min-height:0;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--body);font-weight:700;font-size:11px;color:var(--dim)}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;scrollbar-width:thin}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{padding:8px 10px;border:2px solid var(--line);border-radius:4px;text-align:left;background:var(--glass)}
.opt b{display:block;font-weight:900;font-size:14px}
.opt small{color:var(--dim);font-size:11px}
.opt[aria-pressed="true"]{border-color:var(--volt);background:rgba(255,214,10,.14)}
.stg{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 10px 6px 6px;text-align:left;
  background:var(--glass);border:2px solid transparent;border-left:6px solid var(--sw);border-radius:4px}
.stg[aria-pressed="true"]{border-color:var(--volt);border-left-color:var(--sw)}
.stg canvas{width:58px;height:44px;display:block}
.stg .nm{font-weight:900;font-size:14px;line-height:1.25}
.stg .ft{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:1px}
.stg .bt{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:12px;color:var(--volt);text-align:right}
.stg .bt i{display:block;font-style:normal;font-family:var(--body);font-size:9.5px;color:var(--dim)}
.grp{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--dim);margin-top:2px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.chr{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:2px solid transparent;border-radius:6px;background:var(--glass);font-size:10.5px;font-weight:700}
.chr canvas{width:46px;height:46px}
.chr[aria-pressed="true"]{border-color:var(--volt);background:rgba(255,214,10,.16)}
.kt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:8px 12px;text-align:left;border:2px solid var(--line);border-radius:4px;background:var(--glass)}
.kt[aria-pressed="true"]{border-color:var(--volt);background:rgba(255,214,10,.14)}
.kt b{font-weight:900;font-size:14px;display:block}.kt small{font-size:11px;color:var(--dim)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:10px;color:var(--dim);align-items:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--volt)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 3px var(--hot)}
.item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;padding:7px 10px;background:var(--glass);border-radius:4px}
.item canvas{width:40px;height:40px}
.item b{font-weight:900;font-size:13.5px;display:flex;gap:8px;align-items:center}
.item b em{font-style:normal;font-size:10px;padding:1px 6px;border:1px solid var(--hot);color:var(--hot);border-radius:99px}
.item p{font-size:11.5px;color:var(--dim);line-height:1.5}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:var(--glass);border-radius:4px;text-align:left;width:100%}
.tog b{font-weight:900;font-size:14px;display:block}.tog small{font-size:11px;color:var(--dim)}
.tog .sw2{flex:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative}
.tog .sw2::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .15s}
.tog[aria-pressed="true"] .sw2{background:var(--hot)}.tog[aria-pressed="true"] .sw2::after{transform:translateX(20px)}
.note{font-size:11.5px;color:var(--dim);line-height:1.7;border-left:3px solid var(--hot);padding-left:10px}
.note b{color:var(--paper)}

.rk{display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 10px;background:var(--glass);border-radius:4px;font-size:13px}
.rk canvas{width:34px;height:34px}
.rk .r{font-family:var(--display);color:var(--dim);text-align:right}
.rk .nm2{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .tm{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--volt)}
.rk.me{outline:2px solid var(--volt)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:2px solid var(--line);border-radius:99px;font-size:12px;font-weight:900;background:var(--glass)}
.chip[aria-pressed="true"]{border-color:var(--volt);background:rgba(255,214,10,.16)}
.field{display:flex;gap:6px;align-items:center}
.field input{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--paper);background:var(--glass);border:2px solid var(--line);border-radius:4px;padding:8px 10px;-webkit-user-select:text;user-select:text}
.field input:focus{outline:none;border-color:var(--volt)}
.field button,.mini{padding:8px 14px;border:2px solid var(--line);border-radius:4px;font-weight:900;font-size:12.5px;background:var(--glass);white-space:nowrap}
.code{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--volt);-webkit-user-select:text;user-select:text}
.box{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--glass);border-radius:4px}
.box>b{font-weight:900;font-size:14px}.box small{font-size:11px;color:var(--dim);line-height:1.6}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.tl,.tr{position:absolute;top:10px;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.tl{left:14px}.tr{right:14px;align-items:flex-end}
#lap{font-size:13px;font-weight:900;letter-spacing:.08em}
#time{font-size:clamp(22px,4.6vw,34px);line-height:1}
#best{font-size:12px;color:var(--volt)}
#chips{font-size:12px;font-weight:900;color:#7dff5c}
#pos{font-size:clamp(34px,7vw,56px);line-height:.9}
#pos small{font-size:.4em;color:var(--dim)}
#spd{font-size:13px}
#quit{pointer-events:auto;margin-top:4px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--glass);border:1px solid var(--line);border-radius:4px}
#map{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:96px;height:96px;opacity:.92}
#msg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) skewX(-9deg);font-family:var(--display);
  font-size:clamp(34px,10vw,96px);color:var(--volt);text-shadow:5px 5px 0 var(--ink);white-space:nowrap;opacity:0;transition:opacity .15s}
#msg.on{opacity:1}
#msg.small{font-size:clamp(18px,4.2vw,32px);color:var(--paper)}
#nova{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,#fff 38%,rgba(255,255,255,.2) 78%);opacity:0;pointer-events:none}
#rush{position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0deg 1.2deg,transparent 1.2deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 42%,#000 85%);mask:radial-gradient(circle,transparent 42%,#000 85%)}
#rush.on{opacity:1}
.pad{position:absolute;border-radius:50%;pointer-events:none;display:none}
#ring{width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(246,242,232,.45);background:rgba(246,242,232,.06)}
#knob{width:46px;height:46px;margin:-23px 0 0 -23px;background:rgba(246,242,232,.72)}
.btn{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;font-family:var(--display);
  background:var(--glass);border:3px solid var(--line);color:var(--paper)}
.btn.down{background:rgba(246,242,232,.28)}
#bDrift{right:18px;bottom:18px;width:116px;height:116px;font-size:17px}
#bDrift.t1{border-color:#3aa0ff;box-shadow:0 0 22px #3aa0ff}
#bDrift.t2{border-color:#ffd60a;box-shadow:0 0 26px #ffd60a}
#bDrift.t3{border-color:#c05bff;box-shadow:0 0 30px #c05bff}
#bBrake{right:150px;bottom:18px;width:74px;height:74px;font-size:11px}
#bItem{right:24px;bottom:150px;width:86px;height:86px;border-radius:14px;padding:0}
#bItem canvas{width:56px;height:56px}
#bItem.has{border-color:var(--volt);background:rgba(255,214,10,.2)}
#iName{position:absolute;right:118px;bottom:182px;font-size:12px;font-weight:900;text-shadow:0 2px 0 #000;text-align:right}

/* ---------- result ---------- */
#result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,11,17,.8);padding:14px}
.card{width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,50px);line-height:1;transform:skewX(-9deg);transform-origin:left;color:var(--volt)}
.card ol{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px}
.card li{display:flex;gap:8px;justify-content:space-between;padding:3px 8px;border-bottom:1px solid var(--line)}
.card li.me{background:rgba(255,214,10,.16);font-weight:900}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card .row button{padding:11px 20px;border:2px solid var(--line);border-radius:4px;font-weight:900;background:var(--glass)}
.card .row button.pri{background:var(--hot);border-color:var(--hot);color:#fff}
#err{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;line-height:1.8}
@media (prefers-reduced-motion:reduce){#msg,#rush,.tog .sw2::after{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>

  <div id="hud" hidden>
    <div id="rush"></div>
    <div class="tl">
      <div id="lap">LAP 1</div>
      <div id="time" class="num">0:00.000</div>
      <div id="best" class="num"></div>
      <div id="chips"></div>
    </div>
    <div class="tr">
      <div id="pos" class="num"></div>
      <div id="spd" class="num">0 km/h</div>
      <button id="quit" type="button">ホームへ</button>
    </div>
    <canvas id="map" width="192" height="192"></canvas>
    <div id="msg"></div>
    <div id="ring" class="pad"></div><div id="knob" class="pad"></div>
    <div id="iName"></div>
    <button id="bItem" class="btn" type="button" aria-label="アイテムを使う"><canvas id="iIcon" width="112" height="112"></canvas></button>
    <button id="bBrake" class="btn" type="button">BRAKE</button>
    <button id="bDrift" class="btn" type="button">DRIFT</button>
    <div id="nova"></div>
  </div>

  <div id="home">
    <nav class="rail">
      <div class="logo">race-<span>master</span><i>ACTION KART RACING</i></div>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-t="race" aria-selected="true" type="button">レース</button>
        <button class="tab" role="tab" data-t="char" aria-selected="false" type="button">キャラクター</button>
        <button class="tab" role="tab" data-t="kart" aria-selected="false" type="button">マシン</button>
        <button class="tab" role="tab" data-t="item" aria-selected="false" type="button">アイテム図鑑</button>
        <button class="tab" role="tab" data-t="rank" aria-selected="false" type="button">ランキング</button>
        <button class="tab" role="tab" data-t="set" aria-selected="false" type="button">設定</button>
      </div>
    </nav>
    <div class="mid">
      <div class="plate">
        <div class="who" id="who"></div>
        <button id="go" type="button">スタート</button>
      </div>
    </div>
    <section class="panel" id="panel"></section>
  </div>

  <div id="result" hidden>
    <div class="card">
      <h2 id="rTitle"></h2>
      <div id="rSub" class="num"></div>
      <ol id="rList"></ol>
      <div class="row"><button class="pri" id="rAgain" type="button">もう一度走る</button><button id="rMenu" type="button">ホームへ</button></div>
    </div>
  </div>
  <div id="err">この端末またはブラウザでは WebGL が使えないため、ゲームを表示できません。別のブラウザで開いてみてください。</div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#gl');
const gl = cv.getContext('webgl', { antialias: true, alpha: false });
if (!gl) { $('#err').style.display = 'grid'; $('#home').hidden = true; return; }

// ================================================================ data
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mul3 = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const fmt = t => { if (!t) return '-:--.---'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// pts: [x, z, height]。mode: open=コース外は悪路 / wall=ガードあり / lava=外は溶岩 / void=ガードなし
// sc: 近道（制御点 a から b へまっすぐ結ぶ）
const STAGES = [
  { id:'master_circuit', name:'マスター・サーキット', feat:'王道のアスファルト。ダートの近道あり', sw:'#4cc46a', mode:'open', off:.55, width:10,
    skyT:[.25,.52,.9], sky:[.66,.84,.96], ground:[.3,.58,.28], road:[.27,.28,.32], fog:[120,620], sc:[3,5], root:110,

  { id:'ancient_desert', name:'古代の砂漠', feat:'砂煙の向こうに遺跡を抜ける隠し道', sw:'#e0a44a', mode:'open', off:.4, width:10,
    skyT:[.5,.62,.8], sky:[.95,.8,.56], ground:[.84,.67,.4], road:[.5,.4,.3], fog:[40,300], sc:[3,5], root:104,
    pts:[[0,0],[90,-10],[150,30],[120,80],[160,130],[100,160],[40,130],[-10,150],[-70,120],[-50,60],[-100,20],[-60,-20]] },
  { id:'volcano_core', name:'ボルケーノ・コア', feat:'外は溶岩。岩の橋か、ニトロで強行突破', sw:'#ff5a1f', mode:'lava', off:.6, width:10,
    skyT:[.03,.01,.02], sky:[.3,.07,.03], ground:[1,.42,.06], road:[.21,.18,.18], fog:[90,520], sc:[2,4], root:92,
    pts:[[0,0],[60,0],[100,40],[60,70],[100,110],[50,140],[0,110],[-40,140],[-90,100],[-50,60],[-90,20],[-40,-10]] },
  { id:'cosmo_skyway', name:'コスモ・スカイウェイ', feat:'宇宙に浮かぶガードなしコース。落下注意', sw:'#6fd3ff', mode:'void', off:1, width:11,
    skyT:[.0,.0,.03], sky:[.06,.03,.16], ground:null, road:[.2,.22,.42], fog:[400,2400], sc:[4,6], root:123,
    pts:[[0,0,0],[70,0,0],[120,30,9],[100,80,18],[40,70,11],[10,110,4],[-50,100,11],[-90,50,20],[-60,0,9],[-30,-30,2]] },
];
// [名前, 0=かわいい/1=かっこいい, 肌, スーツ, 髪orヘルメット, 耳, 耳色, 目, 目色, 鼻, 頭の飾り, 飾り色]
const CH = [
 ['ミケ',0,'#f7e6c8','#ff8fa3',null,'cat','#e8904a','dot','#2a1b12','snoutS','',''],
 ['ピョン',0,'#ffffff','#7fd3ff',null,'bunny','#ffc2d4','dot','#3a2030','',  '',''],

  ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(X(tr.sc.ax), Z(tr.sc.az)); ctx.lineTo(X(tr.sc.bx), Z(tr.sc.bz)); ctx.lineWidth = Math.max(2, w / 45); ctx.strokeStyle = '#ffd60a'; ctx.stroke(); ctx.setLineDash([]);

function drawFace(cvs, ch){
  const c = cvs.getContext('2d'), S = cvs.width, u = S / 100, H = ch.h; c.clearRect(0, 0, S, S); c.save(); c.scale(u, u);
  const el = (x, y, rx, ry, col) => { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); }, tri = (x, y, w, hh, col) => { c.fillStyle = col; c.beginPath(); c.moveTo(x - w, y); c.lineTo(x + w, y); c.lineTo(x, y - hh); c.fill(); };
  el(50, 92, 30, 16, H.suit);
  for (const s of [-1, 1]) { const x = 50 + s * 22;
    if (ch.ear === 'cat') tri(x, 30, 13, 24, H.earC); if (ch.ear === 'horn') tri(x, 28, 7, 24, H.earC);
    if (ch.ear === 'bunny') { el(50 + s * 14, 14, 8, 22, H.skin); el(50 + s * 14, 14, 4, 16, H.earC); }
    if (ch.ear === 'bear') el(50 + s * 26, 24, 12, 12, H.earC); if (ch.ear === 'mouse') { el(50 + s * 30, 22, 17, 17, H.skin); el(50 + s * 30, 22, 11, 11, H.earC); }
    if (ch.ear === 'dog') el(50 + s * 33, 52, 9, 20, H.earC); if (ch.ear === 'frog') { el(50 + s * 18, 22, 13, 13, H.earC); el(50 + s * 18, 21, 6, 7, '#0c160c'); } if (ch.ear === 'bolt') el(50 + s * 36, 50, 6, 10, H.earC); }
  if (ch.top === 'halo') { c.strokeStyle = H.topC; c.lineWidth = 5; c.beginPath(); c.ellipse(50, 10, 22, 6, 0, 0, 7); c.stroke(); }
  if (ch.top === 'antenna') { c.fillStyle = '#8a8f9a'; c.fillRect(48, 4, 4, 18); el(50, 6, 6, 6, H.topC); }
  if (ch.eye === 'led') { c.fillStyle = H.skin; c.fillRect(18, 20, 64, 58); } else el(50, 50, 33, 31, H.skin);
  if (ch.hair) { c.fillStyle = H.hair; c.beginPath(); if (ch.top === 'hood' || ch.eye === 'slit' || ch.eye === 'visor') { c.ellipse(50, 50, 36, 34, 0, 0, 7); c.fill(); if (ch.top === 'hood') el(50, 55, 25, 23, H.skin); } else { c.ellipse(50, 44, 35, 30, 0, Math.PI, 2 * Math.PI); c.fill(); } }
  if (ch.top === 'cap') { c.fillStyle = H.topC; c.beginPath(); c.ellipse(50, 42, 35, 28, 0, Math.PI, 2 * Math.PI); c.fill(); c.fillRect(14, 38, 72, 7); }
  if (ch.top === 'band') { c.fillStyle = H.topC; c.fillRect(16, 32, 68, 8); }
  if (ch.top === 'crown') { c.fillStyle = H.topC; c.fillRect(30, 14, 40, 10); for (const x of [34, 50, 66]) tri(x, 15, 7, 12, H.topC); }
  if (ch.top === 'tuft' || ch.top === 'spike') for (const x of ch.top === 'tuft' ? [50] : [36, 50, 64]) tri(x, 24, 9, 20, H.topC);
  if (ch.top === 'fin' || ch.top === 'plume') { c.fillStyle = H.topC; c.fillRect(46, 4, 8, 22); } if (ch.top === 'crest') for (const s of [-1, 1]) tri(50 + s * 12, 22, 5, 20, H.topC);
  if (ch.nose === 'mask') { c.fillStyle = H.hair; c.beginPath(); c.ellipse(50, 56, 33, 26, 0, .1, Math.PI - .1); c.fill(); }
  if (ch.eye === 'dot') for (const s of [-1, 1]) { el(50 + s * 13, 50, 5, 7, H.eyeC); el(50 + s * 14.5, 47.5, 1.8, 2.2, '#fff'); }
  if (ch.eye === 'patch') for (const s of [-1, 1]) { el(50 + s * 14, 50, 10, 12, H.eyeC); el(50 + s * 13, 49, 4, 5, '#fff'); }
  if (ch.eye === 'big') for (const s of [-1, 1]) el(50 + s * 14, 50, 9, 12, H.eyeC);

  if (ch.eye === 'visor') { c.beginPath(); c.roundRect(24, 42, 52, 15, 6); c.fill(); } if (ch.eye === 'shades') { c.beginPath(); c.roundRect(22, 43, 56, 12, 5); c.fill(); }
  if (ch.eye === 'slit') { c.fillRect(28, 46, 44, 5); c.fillRect(47, 46, 6, 22); } if (ch.eye === 'led') { c.fillRect(28, 42, 44, 9); c.fillRect(38, 62, 24, 4); }
  if (ch.nose === 'beak') tri(50, 66, 8, -9, '#ff9d1f'); if (ch.nose === 'snout') { el(50, 63, 13, 9, 'rgba(255,255,255,.5)'); el(50, 60, 4, 3, '#2a1a1a'); } if (ch.nose === 'snoutS') { el(50, 62, 8, 6, 'rgba(255,255,255,.6)'); el(50, 60, 3, 2.2, '#4a2a2a'); }
  c.restore();
}
function drawItemIcon(cvs, id){
  const c = cvs.getContext('2d'), S = cvs.width, u = S / 100, col = ITEMS[id].c; c.clearRect(0, 0, S, S); c.save(); c.scale(u, u); c.fillStyle = col; c.strokeStyle = col; c.lineWidth = 8; c.lineCap = c.lineJoin = 'round';
  const circ = (x, y, r, fill = 1) => { c.beginPath(); c.arc(x, y, r, 0, 7); fill ? c.fill() : c.stroke(); };
  if (id === 'orb') { circ(56, 50, 24); c.globalAlpha = .5; c.fillRect(8, 38, 26, 6); c.fillRect(4, 52, 22, 6); }
  if (id === 'homing') { c.beginPath(); c.moveTo(58, 8); c.lineTo(28, 54); c.lineTo(48, 54); c.lineTo(40, 92); c.lineTo(74, 42); c.lineTo(54, 42); c.closePath(); c.fill(); }
  if (id === 'trap') { circ(50, 50, 36, 0); circ(50, 50, 20, 0); circ(50, 50, 6); }
  if (id === 'nova') { circ(50, 50, 16); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.beginPath(); c.moveTo(50 + Math.cos(a) * 26, 50 + Math.sin(a) * 26); c.lineTo(50 + Math.cos(a) * 42, 50 + Math.sin(a) * 42); c.stroke(); } }
  if (id === 'nitro') { c.beginPath(); c.roundRect(32, 26, 36, 62, 12); c.fill(); c.fillRect(42, 10, 16, 16); c.fillStyle = '#090b11'; c.beginPath(); c.moveTo(54, 40); c.lineTo(42, 60); c.lineTo(50, 60); c.lineTo(46, 76); c.lineTo(60, 54); c.lineTo(52, 54); c.fill(); }
  if (id === 'shield') { c.beginPath(); c.moveTo(50, 8); c.lineTo(84, 22); c.lineTo(80, 60); c.lineTo(50, 92); c.lineTo(20, 60); c.lineTo(16, 22); c.closePath(); c.fill(); }
  if (id === 'chip') { c.beginPath(); c.roundRect(24, 24, 52, 52, 8); c.fill(); for (const p of [34, 50, 66]) { c.fillRect(p - 3, 8, 6, 16); c.fillRect(p - 3, 76, 6, 16); c.fillRect(8, p - 3, 16, 6); c.fillRect(76, p - 3, 16, 6); } }
  if (id === 'warp') { for (const r of [38, 25, 12]) { c.beginPath(); c.arc(50, 50, r, r * .1, r * .1 + 4.6); c.stroke(); } }
  c.restore();
}

const mapCtx = $('#map').getContext('2d'); let lastItem = '';
function hud(){
  if (state === 'home' || state === 'result') return;
  const k = me, vs = mode() === 'vs';
  $('#lap').textContent = vs ? 'LAP ' + clamp(k.lapNo, 1, LAPS) + '/' + LAPS : 'LAP ' + Math.max(1, k.lapNo);
  $('#time').textContent = state === 'count' ? '0:00.000' : fmt(Math.max(.0001, vs ? raceT : raceT - k.lapStart));
  $('#best').textContent = vs ? '' : 'BEST ' + fmt(best[ST.id]);
  $('#chips').textContent = k.chips ? 'CHIP ×' + k.chips : '';
  if (vs) $('#pos').innerHTML = (rankOf(k) + 1) + '<small>/' + karts.length + '</small>';
  $('#spd').textContent = Math.round(Math.abs(k.v) * 6) + ' km/h';
  $('#bDrift').className = 'btn' + (input.drift ? ' down' : '') + (k.drift && k.tier ? ' t' + k.tier : '');
  if ((k.item || '') !== lastItem) { lastItem = k.item || ''; const ic = $('#iIcon'); if (k.item) drawItemIcon(ic, k.item); else ic.getContext('2d').clearRect(0, 0, 112, 112); $('#bItem').classList.toggle('has', !!k.item); $('#iName').textContent = k.item ? ITEMS[k.item].n : ''; }
  $('#rush').classList.toggle('on', k.boost > 0 && !opt.lite);
  $('#nova').style.opacity = novaT > 0 ? Math.min(1, novaT * 1.2) : 0;
  drawMap(mapCtx, TR, 192, 192, karts);
}

// ================================================================ input
const ring = $('#ring'), knob = $('#knob'), RANGE = 58;
let steerId = null, cx = 0;
stageEl.addEventListener('pointerdown', e => {
  if (state !== 'race' && state !== 'count') return;
  if (e.target.closest('button') || steerId !== null) return;
  const p = loc(e); steerId = e.pointerId; cx = p.x; input.steer = 0;
  ring.style.display = knob.style.display = 'block'; ring.style.left = knob.style.left = p.x + 'px'; ring.style.top = knob.style.top = p.y + 'px';
});
stageEl.addEventListener('pointermove', e => {
  if (e.pointerId !== steerId) return;
  const p = loc(e); let dx = p.x - cx;
  if (Math.abs(dx) > RANGE) { cx = p.x - Math.sign(dx) * RANGE; dx = p.x - cx; ring.style.left = cx + 'px'; }   // 引っ張りすぎたら中心が追従
  const raw = dx / RANGE, m = Math.abs(raw); input.steer = m < .08 ? 0 : Math.sign(raw) * (m - .08) / .92;
  knob.style.left = p.x + 'px'; knob.style.top = p.y + 'px';
});
const endSteer = e => { if (e.pointerId !== steerId) return; steerId = null; input.steer = 0; ring.style.display = knob.style.display = 'none'; };
addEventListener('pointerup', endSteer); addEventListener('pointercancel', endSteer);
function hold(el, key){
  el.addEventListener('pointerdown', e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {} input[key] = true; el.classList.add('down'); });
  const up = () => { input[key] = false; el.classList.remove('down'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
hold($('#bDrift'), 'drift'); hold($('#bBrake'), 'brake');
$('#bItem').addEventListener('pointerdown', e => { e.preventDefault(); input.item = true; });
const keys = {};
const keySteer = () => { if (steerId === null) input.steer = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0); };
addEventListener('keydown', e => { if (state === 'home' || state === 'result') return; keys[e.code] = true; keySteer();
  if (e.code === 'Space' || e.code === 'ShiftLeft') { input.drift = true; e.preventDefault(); } if (e.code === 'ArrowDown' || e.code === 'KeyS') input.brake = true; if (e.code === 'KeyE' || e.code === 'Enter') input.item = true; });
addEventListener('keyup', e => { keys[e.code] = false; keySteer(); if (e.code === 'Space' || e.code === 'ShiftLeft') input.drift = false; if (e.code === 'ArrowDown' || e.code === 'KeyS') input.brake = false; });
addEventListener('contextmenu', e => e.preventDefault());
// パネルのスクロール（画面を回転していても指の動きに合わせる）。動かしたときはタップ扱いにしない
let drag = null, moved = false;
stageEl.addEventListener('pointerdown', e => { const sc = e.target.closest('.scroll'); moved = false; if (sc) drag = { el: sc, y: loc(e).y, top: sc.scrollTop, id: e.pointerId }; });
stageEl.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId) return; const dy = loc(e).y - drag.y; if (Math.abs(dy) > 8) moved = true; if (moved) drag.el.scrollTop = drag.top - dy; });
addEventListener('pointerup', () => { drag = null; }); addEventListener('pointercancel', () => { drag = null; });
stageEl.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);

// ================================================================ home UI
let tab = 'race';
const bar = v => `<span class="bar"><i style="width:${clamp(Math.round((v - .7) / .6 * 100), 8, 100)}%"></i></span>`;
function renderPanel(){
  const el = $('#panel'); let h = '';
  if (tab === 'race') {
    h = `<h2>レース<small>モードとステージを選ぶ</small></h2><div class="seg">
      <button class="opt" data-mode="ta" aria-pressed="${sel.mode === 'ta'}" type="button"><b>タイムアタック</b><small>1人・アイテムなし・周回無制限</small></button>
      <button class="opt" data-mode="vs" aria-pressed="${sel.mode === 'vs'}" type="button"><b>VSレース</b><small>CPU 11台と3周・アイテムあり</small></button></div>
      <div class="scroll">` + STAGES.map((s, i) => `<button class="stg" type="button" data-stage="${i}" aria-pressed="${i === sel.stage}" style="--sw:${s.sw}"><canvas width="116" height="88" data-map="${i}"></canvas><span class="nm">${s.name}<span class="ft">${s.feat}</span></span><span class="bt">${fmt(best[s.id])}<i>ベストラップ</i></span></button>`).join('') + `<p class="note">黄色の点線が近道。タイムアタックの記録はこの端末に保存されます。</p></div>`;
  } else if (tab === 'char') {
    const grid = g => CH.map((c, i) => c.g === g ? `<button class="chr" type="button" data-ch="${i}" aria-pressed="${i === sel.ch}"><canvas width="92" height="92" data-face="${i}"></canvas>${c.n}</button>` : '').join('');
    h = `<h2>キャラクター<small>全30体・性能差なし</small></h2><div class="scroll"><div class="grp">かわいい系</div><div class="chars">${grid(0)}</div><div class="grp">かっこいい系</div><div class="chars">${grid(1)}</div></div>`;
  } else if (tab === 'kart') {
    h = `<h2>マシン<small>タイプとカラー</small></h2><div class="scroll">` + KT.map((k, i) => `<button class="kt" type="button" data-kt="${i}" aria-pressed="${i === sel.kt}"><span><b>${k.n}</b><small>${k.d}</small></span><span class="bars"><span>最高速</span>${bar(k.top + (k.top - 1) * 3)}<span>加速</span>${bar(k.acc)}<span>ハンドリング</span>${bar(k.turn + (k.turn - 1))}<span>ミニターボ</span>${bar(k.mt)}</span></button>`).join('') +
      `<div class="grp">ボディカラー</div><div class="sws">` + COLS.map((c, i) => `<button class="sw" type="button" data-col="${i}" aria-pressed="${i === sel.col}" aria-label="カラー${i + 1}" style="--c:${c}"></button>`).join('') + `</div></div>`;
  } else if (tab === 'item') {
    h = `<h2>アイテム図鑑<small>VSレースで光る箱から出現</small></h2><div class="scroll">` + Object.keys(ITEMS).map(id => `<div class="item"><canvas width="80" height="80" data-item="${id}"></canvas><div><b>${ITEMS[id].n}${ITEMS[id].low ? '<em>下位専用</em>' : ''}</b><p>${ITEMS[id].d}</p></div></div>`).join('') + `</div>`;
  } else if (tab === 'rank') {
    h = `<h2>ランキング<small>タイムアタックの最速ラップ（全プレイヤー）</small></h2>
      <div class="field"><input id="pname" maxlength="12" placeholder="プレイヤー名（12文字まで）" value="${esc(pname)}" autocomplete="off"><button type="button" data-act="name">名前を保存</button></div>
      <div class="chips">` + STAGES.map((s, i) => `<button class="chip" type="button" data-stage="${i}" aria-pressed="${i === sel.stage}">${i + 1}. ${s.name}</button>`).join('') + `</div><div class="scroll" id="rkList"></div>`;
  } else {
    const tg = (key, t, s) => `<button class="tog" type="button" data-opt="${key}" aria-pressed="${!!opt[key]}"><span><b>${t}</b><small>${s}</small></span><span class="sw2"></span></button>`;
    h = `<h2>設定</h2><div class="scroll">${tg('lite', '軽量化モード', '解像度を下げ、影とエフェクトを省いて動作を軽くする')}${tg('bgm', 'BGM', 'レース中の音楽')}${tg('se', '効果音', 'エンジン音・アイテム・ドリフトの音')}
      <p class="note"><b>ハンドル</b>：画面のどこでも触って左右にスライド（触れた場所が中心）<br><b>ドリフト</b>：曲がりながら右下の DRIFT を長押し。青・黄・紫とたまり、離すとミニターボ<br><b>アクセル</b>は自動。キーボードは ←→ / Space / ↓ / E<br>端末を縦に持っていても、画面は横向きで表示されます。</p>
      <div class="box"><b>引き継ぎコード</b>${acct.code ? `<span class="code">${acct.code}</span><small>別の端末でこのコードを入力すると、ランキングの記録を引き継げます。他の人には見せないでください。</small><button class="mini" type="button" data-act="copy">コードをコピー</button>` : '<small>タイムアタックで最初の記録を送信すると発行されます。</small>'}
      <div class="field"><input id="rcode" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"><button type="button" data-act="restore">このコードで引き継ぐ</button></div><small id="rmsg">${esc(net.note)}</small></div></div>`;
  }
  el.innerHTML = h;
  if (tab === 'rank') { if (net.stage !== ST.id) { net.rows = null; net.err = ''; } renderRank(); net.poll = time; loadTop(ST.id); }
  el.querySelectorAll('[data-map]').forEach(c => { const st = STAGES[+c.dataset.map]; drawMap(c.getContext('2d'), TRACKS[st.id] || (TRACKS[st.id] = buildTrack(st)), 116, 88); });
  el.querySelectorAll('[data-face]').forEach(c => drawFace(c, CH[+c.dataset.face]));
  el.querySelectorAll('[data-item]').forEach(c => drawItemIcon(c, c.dataset.item));

  $('#who').innerHTML = `<b>${CH[sel.ch].n}</b>${KT[sel.kt].n}　／　${ST.name}　／　${sel.mode === 'vs' ? 'VSレース' : 'タイムアタック'}`;
}
function renderRank(){
  const el = $('#rkList'); if (!el) return;
  if (net.err) { el.innerHTML = `<p class="note">${net.err}</p>`; return; }
  if (!net.rows || net.stage !== ST.id) { el.innerHTML = '<p class="note">読み込み中…</p>'; return; }
  if (!net.rows.length) { el.innerHTML = '<p class="note">まだ記録がありません。タイムアタックで最初の記録を出そう。</p>'; return; }
  el.innerHTML = net.rows.map((r, i) => `<div class="rk${r.id === acct.pid ? ' me' : ''}"><span class="r">${i + 1}</span><canvas width="68" height="68" data-face="${clamp(parseInt(String(r.icon).slice(3)) || 0, 0, CH.length - 1)}"></canvas><span class="nm2">${esc(r.name || 'PLAYER')}</span><span class="tm">${fmt(r.lapMs / 1000)}</span></div>`).join('');
  el.querySelectorAll('[data-face]').forEach(c => drawFace(c, CH[+c.dataset.face]));

$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.t; se(520, .05, 'square', .04); renderPanel(); });
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const ds = b.dataset, keep = $('#panel .scroll') ? $('#panel .scroll').scrollTop : 0;
  if (ds.act === 'name') { pname = $('#pname').value.trim().slice(0, 12); saveAcct(); syncProfile().then(() => loadTop(ST.id)); }
  else if (ds.act === 'copy') { try { navigator.clipboard.writeText(acct.code).then(() => { net.note = 'コピーしました'; renderPanel(); }, () => {}); } catch (x) {} return; }
  else if (ds.act === 'restore') { const v = $('#rcode').value; $('#rmsg').textContent = '確認中…'; restore(v).then(msg => { net.note = msg; renderPanel(); }); return; }
  else if (ds.mode) sel.mode = ds.mode; else if (ds.stage) selectStage(+ds.stage); else if (ds.ch) { sel.ch = +ds.ch; syncProfile(); } else if (ds.kt) sel.kt = +ds.kt; else if (ds.col) sel.col = +ds.col; else if (ds.opt) opt[ds.opt] = !opt[ds.opt]; else return;
  audioInit(); se(660, .06, 'square', .04); save(); renderPanel(); const sc = $('#panel .scroll'); if (sc) sc.scrollTop = keep;
});
$('#go').addEventListener('click', startRace); $('#rAgain').addEventListener('click', startRace);
$('#rMenu').addEventListener('click', toHome); $('#quit').addEventListener('click', toHome);

// ================================================================ loop
let lastT = 0, accu = 0;
function frame(t){
  const dt = Math.min(.1, (t - lastT) / 1000 || 0); lastT = t; accu += dt;
  let n = 0; while (accu >= 1 / 60 && n++ < 6) { step(1 / 60); accu -= 1 / 60; }
  render(dt); hud(); audioTick();
  if (state === 'home' && tab === 'rank' && time - net.poll > 6) { net.poll = time; loadTop(ST.id); }   // 開いている間は数秒おきに最新化
  requestAnimationFrame(frame);
}
function start(saved){
  if (saved && saved.stage >= 0 && saved.stage < STAGES.length) sel.stage = saved.stage;
  if (saved && saved.tab) tab = saved.tab;
  selectStage(sel.stage); renderPanel(); requestAnimationFrame(frame);
}
window.__rm = { get state(){ return state; }, get me(){ return me; }, get karts(){ return karts; }, input, sel, step, selectStage, startRace, toHome, setTab(t){ tab = t; renderPanel(); } };
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ stage: sel.stage, tab }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
