*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;min-height:100vh;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px clamp(14px,4vw,32px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:22px;transform:skewX(-9deg)}.logo span{color:var(--hot)}.logo i{font-style:normal;font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.2em;color:var(--volt);margin-left:10px}
main{padding:clamp(14px,3vw,28px) clamp(14px,4vw,32px);max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:400;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.login{max-width:420px;margin:8vh auto 0}
label{font-size:12px;font-weight:900;color:var(--dim);display:flex;flex-direction:column;gap:4px}
input{background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:10px 12px;font-weight:700;width:100%}
input:focus{outline:none;border-color:var(--volt)}
.btn{padding:10px 18px;border:2px solid var(--line);border-radius:4px;font-weight:900;font-size:13.5px;background:rgba(246,242,232,.04)}
.btn.pri{background:var(--hot);border-color:var(--hot);color:#fff}
.note{font-size:12.5px;color:var(--dim);border-left:3px solid var(--hot);padding-left:10px;overflow-wrap:anywhere}
.note b{color:var(--paper)}.note code{color:var(--volt);-webkit-user-select:all;user-select:all}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar input{max-width:280px}
.count{font-size:13px;color:var(--dim)}.count b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--volt);margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--panel);border:2px solid var(--line);border-radius:8px;text-align:center;min-width:0}
.pl:hover{border-color:var(--volt)}.pl[aria-pressed="true"]{border-color:var(--volt);background:rgba(255,214,10,.1)}
.pl canvas{width:64px;height:64px;border-radius:50%;background:#1d2334}
.pl b{font-weight:900;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-size:10.5px;color:var(--dim)}
.who{display:flex;align-items:center;gap:14px}
.who canvas{width:72px;height:72px;border-radius:50%;background:#1d2334;flex:none}
.who b{font-family:var(--display);font-weight:400;font-size:24px;display:block;line-height:1.2;overflow-wrap:anywhere}.who small{font-size:11.5px;color:var(--dim);overflow-wrap:anywhere}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{text-align:left;font-size:11px;font-weight:900;color:var(--dim);letter-spacing:.06em;padding:6px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--display);font-variant-numeric:tabular-nums}
td .rank{font-family:var(--display);font-size:17px;color:var(--volt)}td .rank.first{color:var(--hot)}
.laps{display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}.laps i{font-style:normal;color:var(--dim);font-size:10.5px;margin-right:3px}
.bests{display:flex;flex-wrap:wrap;gap:8px}.bests span{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px}.bests b{font-family:var(--display);font-weight:400;color:var(--volt);margin-left:6px}
</style>
</head>

  let ms = [], bests = '', err = '';
  try { const o = await get('matches/' + id); ms = Object.values(o || {}).filter(m => m && m.stage).sort((a, b) => (b.at || 0) - (a.at || 0)); } catch (e) { err = '対戦の記録を読み込めませんでした。'; }
  try { const rs = await Promise.all(Object.keys(STG).map(s => jf(`${FB.db}/rankings_v2/${s}/${id}.json`).catch(() => null))); bests = Object.keys(STG).map((s, i) => rs[i] && rs[i].lapMs ? `<span>${STG[s]}<b>${fmt(rs[i].lapMs)}</b></span>` : '').join(''); } catch (e) {}
  if (cur !== id) return;
  const rows = ms.map(m => { const laps = String(m.laps || '').split(',').filter(Boolean).map(Number);
    return `<tr><td>${day(m.at)}</td><td>${esc(STG[m.stage] || m.stage)}<br><small style="color:var(--dim)">${m.mode === 'online' ? 'オンライン対戦' : 'VSレース'}${m.tod === 'night' ? '・夜' : m.tod === 'day' ? '・昼' : ''}</small></td><td class="n">${m.n | 0}人<br><small style="font-family:var(--body);color:var(--dim)">プレイヤー ${m.hn | 0}／CPU ${(m.n | 0) - (m.hn | 0)}</small></td><td><span class="rank${m.rank === 1 ? ' first' : ''}">${m.rank | 0}位</span></td><td><div class="laps">${laps.map((l, i) => `<span><i>${i + 1}周目</i>${(l / 1000).toFixed(3)}秒</span>`).join('') || '-'}</div></td><td class="n">${fmt(m.total)}</td></tr>`; }).join('');
  el.innerHTML = head + (bests ? `<div><h2 style="font-size:14px;margin-bottom:6px">タイムアタック自己ベスト（1周）</h2><div class="bests">${bests}</div></div>` : '') +
    `<h2 style="font-size:16px">参加したマッチ（${ms.length}件）</h2>` + (err ? `<p class="note">${err}</p>` : ms.length ? `<div class="tw"><table><thead><tr><th>日時</th><th>コース</th><th>参加人数</th><th>順位</th><th>1周ごとのタイム</th><th>合計</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="note">まだ対戦の記録がありません。VSレースかオンライン対戦をゴールまで走ると、ここに記録されます。</p>');
  drawFace($('#dface'), CH[iconOf(p)]);
}
$('#in').addEventListener('click', login); $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#out').addEventListener('click', logout); $('#q').addEventListener('input', list);
$('#grid').addEventListener('click', e => { const b = e.target.closest('.pl'); if (b) show(b.dataset.id); });
if (auth && auth.refresh) open();
})();
</script>
</body>
